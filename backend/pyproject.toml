[project]
name = "marinus-backend"
version = "0.1.0"
requires-python = ">=3.10"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
addopts = "--reuse-db"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Job Intake | Marinus Painting</title>

    <link rel="stylesheet" href="./dist/output.css">
</head>

<body class="bg-white text-slate-800">

<!-- Simple top navigation -->
<header class="border-b border-slate-300">
    <div class="mx-auto flex max-w-5xl items-center justify-between px-6 py-4">
        <a href="index.html" class="text-sm font-bold tracking-[0.3em] text-slate-800">
            MARINUS
        </a>

        <span class="text-xs font-medium tracking-[0.2em] text-slate-500">
                JOB INTAKE
            </span>
    </div>
</header>

<main class="mx-auto max-w-3xl px-6 py-12">

    <!-- Page introduction -->
    <div class="mb-12">
        <h1 class="text-4xl font-light tracking-tight text-slate-800">
            New job intake
        </h1>

        <p class="mt-2 text-sm text-slate-500">
            Capture the site, the rooms and the finish.
        </p>
    </div>

    <!-- Customer section -->
    <section class="border-t border-slate-500 pt-5">

        <h2 class="text-xs font-bold tracking-[0.25em] text-slate-700">
            <span class="mr-3 text-slate-400">01</span>
            CUSTOMER
        </h2>

        <div class="mt-8">
            <label for="customer-name"
                   class="block text-xs font-medium tracking-[0.15em] text-slate-500">
                CUSTOMER NAME
            </label>

            <input
                    id="customer-name"
                    type="text"
                    class="mt-3 w-full border-b border-slate-200 bg-transparent py-3 outline-none transition focus:border-slate-700"
            >
        </div>

        <div class="mt-6 grid gap-6 md:grid-cols-2">

            <div>
                <label for="phone"
                       class="block text-xs font-medium tracking-[0.15em] text-slate-500">
                    PHONE
                </label>

                <input
                        id="phone"
                        type="tel"
                        class="mt-3 w-full border-b border-slate-200 bg-transparent py-3 outline-none transition focus:border-slate-700"
                >
            </div>

            <div>
                <label for="email"
                       class="block text-xs font-medium tracking-[0.15em] text-slate-500">
                    EMAIL
                </label>

                <input
                        id="email"
                        type="email"
                        class="mt-3 w-full border-b border-slate-200 bg-transparent py-3 outline-none transition focus:border-slate-700"
                >
            </div>

        </div>
    </section>

</main>

</body>
</html>

# Local development database. Start with: docker compose up -d
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: marinus
      MYSQL_USER: marinus
      MYSQL_PASSWORD: marinus
      MYSQL_ROOT_PASSWORD: marinus-root
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-umarinus", "-pmarinus"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
